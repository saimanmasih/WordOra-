name: Build WordOra APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find ZIP
      - name: Find WordOra ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: WordOra ZIP file was not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 3. Extract ZIP
      - name: Extract WordOra project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "WordOra project extracted."

          find extracted -maxdepth 3 -type f | head -100

      # 4. Find package.json
      - name: Locate WordOra project
        shell: bash
        run: |
          set -e

          PACKAGE_FILE=$(find extracted -name package.json -type f | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found."
            echo "ZIP contents:"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 6. Install project dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 7. Build WordOra
      - name: Build WordOra
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          npm run build

      # 8. Install Capacitor
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # 9. Create Capacitor configuration
      - name: Create Capacitor configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.wordora.app",
            "appName": "WordOra",
            "webDir": "dist"
          }
          EOF

          echo "Capacitor configuration created."

      # 10. Add Android
      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          npx cap add android

      # 11. Copy web files
      - name: Copy WordOra into Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          npx cap copy android

      # 12. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 13. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 14. Build APK
      - name: Build WordOra Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      # 15. Check APK
      - name: Verify APK exists
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 16. Upload APK
      - name: Upload WordOra APK
        uses: actions/upload-artifact@v4
        with:
          name: WordOra-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
