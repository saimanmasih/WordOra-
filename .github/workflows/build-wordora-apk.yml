name: WordOra New APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. FIND WORDORA ZIP
      # =========================================================
      - name: Find WordOra ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for WordOra ZIP..."

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: WordOra ZIP file was not found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 3. EXTRACT WORDORA
      # =========================================================
      - name: Extract WordOra project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction completed."


      # =========================================================
      # 4. LOCATE PROJECT
      # =========================================================
      - name: Locate WordOra project
        shell: bash
        run: |
          set -e

          PACKAGE_FILE=$(find extracted \
            -type f \
            -name "package.json" \
            ! -path "*/node_modules/*" \
            | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "WordOra project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 5. VERIFY IMPORTANT FILES
      # =========================================================
      - name: Verify WordOra source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "WORDORA SOURCE CHECK"
          echo "========================================"

          echo "Project:"
          pwd

          echo ""
          echo "Hebrews Roman Urdu files:"
          find src/data/roman_urdu \
            -maxdepth 1 \
            -type f \
            -iname "hebrews*" \
            -print || true

          FILE="src/data/roman_urdu/hebrews_5.json"

          echo ""
          echo "Checking:"
          echo "$FILE"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Hebrews 5 JSON file does not exist."
            exit 1
          fi

          echo "Hebrews 5 file exists."


      # =========================================================
      # 6. SETUP NODE
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # =========================================================
      # 7. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # =========================================================
      # 8. DIAGNOSE HEBREWS 5 JSON
      # =========================================================
      - name: Diagnose Hebrews 5 JSON
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          FILE="src/data/roman_urdu/hebrews_5.json"

          echo "========================================"
          echo "HEBREWS 5 JSON DIAGNOSTIC"
          echo "========================================"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: File does not exist."
            exit 1
          fi

          SIZE=$(wc -c < "$FILE")

          echo "File: $FILE"
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -eq 0 ]; then
            echo ""
            echo "ERROR: hebrews_5.json is EMPTY."
            echo ""
            echo "The build will stop here."
            exit 1
          fi

          echo ""
          echo "First 500 characters:"
          head -c 500 "$FILE" || true

          echo ""
          echo ""
          echo "Last 500 characters:"
          tail -c 500 "$FILE" || true

          echo ""
          echo ""

          node <<'NODE'
          const fs = require("fs");

          const file = "src/data/roman_urdu/hebrews_5.json";
          const text = fs.readFileSync(file, "utf8");

          console.log("Characters:", text.length);
          console.log("Trimmed characters:", text.trim().length);

          if (!text.trim()) {
            console.error("ERROR: JSON file is empty.");
            process.exit(1);
          }

          try {
            const data = JSON.parse(text);

            console.log("");
            console.log("✅ JSON VALID");

            if (Array.isArray(data)) {
              console.log("Root: array");
              console.log("Entries:", data.length);
            } else if (data && typeof data === "object") {
              console.log("Root: object");

              if (Array.isArray(data.verses)) {
                console.log("Verses:", data.verses.length);
              }
            }

          } catch (error) {
            console.error("");
            console.error("❌ JSON INVALID");
            console.error(error.message);
            console.error("");
            console.error("NO Bible text was modified.");
            process.exit(1);
          }
          NODE


      # =========================================================
      # 9. BUILD WEB APP
      # =========================================================
      - name: Build WordOra
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING WORDORA WEB APPLICATION"
          echo "========================================"

          npm run build


      # =========================================================
      # 10. INSTALL CAPACITOR
      # =========================================================
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android


      # =========================================================
      # 11. CREATE CAPACITOR CONFIG
      # =========================================================
      - name: Create Capacitor configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.wordora.app",
            "appName": "WordOra",
            "webDir": "dist"
          }
          EOF

          echo "Capacitor configuration created."


      # =========================================================
      # 12. ADD ANDROID PLATFORM
      # =========================================================
      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npx cap add android


      # =========================================================
      # 13. COPY WEB APP INTO ANDROID
      # =========================================================
      - name: Copy WordOra into Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npx cap copy android


      # =========================================================
      # 14. KOTLIN COMPATIBILITY
      # =========================================================
      - name: Force Kotlin version compatibility
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          cat >> build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                      }
                  }
              }
          }
          EOF


      # =========================================================
      # 15. JAVA 21
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle


      # =========================================================
      # 16. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 17. BUILD APK
      # =========================================================
      - name: Build WordOra APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING WORDORA APK"
          echo "========================================"

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug --stacktrace


      # =========================================================
      # 18. VERIFY APK
      # =========================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "APK VERIFICATION"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "✅ WORDORA APK GENERATED"
          echo ""

          ls -lh "$APK"


      # =========================================================
      # 19. UPLOAD APK
      # =========================================================
      - name: Upload WordOra APK
        uses: actions/upload-artifact@v4
        with:
          name: WordOra-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
